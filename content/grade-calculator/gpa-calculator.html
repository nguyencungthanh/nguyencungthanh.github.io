<h2>GPA Calculator</h2>
<div class="grade-calculator-container">
    <form id="gpa-form" class="input-group">
        <input type="text" required id="courseName" aria-label="Course name" placeholder="Course Name">
        <input type="number" step="any" required id="courseCredits" aria-label="Credits" placeholder="Credits" min="0" style="max-width: 200px;">
        <select id="letterGrade" aria-label="Letter grade" style="max-width: 70px;">
            <option value="4.0">A</option>
            <option value="3.7">A-</option>
            <option value="3.3">B+</option>
            <option value="3.0">B</option>
            <option value="2.7">B-</option>
            <option value="2.3">C+</option>
            <option value="2.0">C</option>
            <option value="1.7">C-</option>
            <option value="1.3">D+</option>
            <option value="1.0">D</option>
            <option value="0.0">F</option>
        </select>
        <button class="btn-add" type="submit">Add</button>
    </form>

    <table id="courseTable">
        <thead>
            <tr>
                <th>Course</th>
                <th>Credits</th>
                <th>Grade</th>
                <th>Points</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <!-- Courses will be added here -->
        </tbody>
    </table>

    <div class="gpa-display">
        <b>CGPA:</b> <span id="totalGPA" role="status">0.00</span>
    </div>
</div>
