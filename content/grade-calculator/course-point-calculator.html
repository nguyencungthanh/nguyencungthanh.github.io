<h2>Course Point Calculator</h2>
<div class="grade-calculator-container">
    <form id="task-form" class="input-group" style="flex-wrap: wrap;">
        <input type="text" required id="taskName" aria-label="Assignment or exam name" placeholder="Assignment/Exams" style="min-width: 140px;">
        <input type="number" step="any" required id="taskScore" aria-label="Score" placeholder="Score" min="0" style="max-width: 80px;">
        <input type="number" step="any" required id="taskMax" aria-label="Maximum score" placeholder="Max" min="0" style="max-width: 80px;">
        <input type="number" step="any" required id="taskWeight" aria-label="Weight percent" placeholder="Weight %" min="0" max="100" style="max-width: 110px;">
        <button class="btn-add" type="submit">Add Task</button>
    </form>

    <table id="taskTable">
        <thead>
            <tr>
                <th>Assignment/Exams</th>
                <th>Score</th>
                <th>Max</th>
                <th>Weight</th>
                <th>Points</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <!-- Tasks will be added here -->
        </tbody>
    </table>

    <div class="gpa-display">
        <b>Total Points:</b> <span id="totalTaskPoints" role="status">0.00</span> / 100
    </div>
</div>
