<!DOCTYPE html>
<html lang='{{ .Site.Language }}'>
<head>
  {{ partial "base/head" . }}
  {{ partial "mathjax.html" . }}
</head>
<body{{ if and .IsPage (eq .Section "posts") }} class="post-page"{{ end }}>
  {{ partialCached "assets/js.html" . }}

  <a href="#main" id='skip-to-content'>Skip to content</a>
  <div class='container'>
    {{ partial "base/header" . }}
    <main id='main'>
      {{ block "main" . }}{{ end }}
    </main>
    {{ partialCached "base/footer" . }}
  </div>
  {{ partial "assets/page-js.html" . }}
</body>
</html>
