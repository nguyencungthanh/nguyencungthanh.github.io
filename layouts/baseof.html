<!DOCTYPE html>
<html lang='{{ .Site.Language }}'>
<head>
  {{ partial "base/head" . }}
  {{ partial "mathjax.html" . }}
</head>
<body>
  {{ partialCached "assets/js.html" . }}
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/dreampulse/computer-modern-web-font@master/fonts.css">

  <a href="#main" id='skip-to-content'>Skip to content</a>
  <div class='container'>
    {{ partial "base/header" . }}
    <main id='main'>
      {{ block "main" . }}{{ end }}
    </main>
    {{ partialCached "base/footer" . }}
  </div>
  
</body>
</html>
