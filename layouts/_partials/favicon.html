{{- $src := printf "https://icons.duckduckgo.com/ip3/%s.ico" . -}}

  {{/* Official Gmail icon: https://ssl.gstatic.com/ui/v1/icons/mail/rfr/gmail.ico */}}
  {{- $src = relURL "/icons/gmail.ico" -}}

<img referrerpolicy="no-referrer" src='{{ $src }}' class='icon' alt=''>
