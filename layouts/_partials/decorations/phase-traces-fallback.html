<svg class="euler-fallback" viewBox="0 0 300 533.333" width="300" height="533" focusable="false">
  <defs>
    <marker id="phase-axis-arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto">
      <path d="m1 1 4 2-4 2" fill="none" stroke="currentColor" stroke-width=".8"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width=".8" opacity=".65" marker-end="url(#phase-axis-arrow)">
    <path d="M49 113H246"/><path d="M150 208V26"/>
    <path d="M26 296H269"/><path d="M42 348V243"/>
    <path d="M26 449H269"/><path d="M42 501V396"/>
  </g>
  <g font-family="STIX Two Text, Georgia, serif" font-style="italic" font-size="15" fill="currentColor">
    <text x="252" y="119">Re</text><text x="157" y="28">Im</text>
    <text x="28" y="25">z = e<tspan dy="-8" font-size="10">iφ</tspan></text>
    <text x="276" y="301">φ</text><text x="276" y="454">φ</text>
    <text class="euler-real" x="29" y="231" fill="currentColor" font-size="17">Re(z)</text>
    <text class="euler-imaginary" x="29" y="384" fill="currentColor" font-size="17">Im(z)</text>
  </g>
  <circle cx="150" cy="113" r="70" fill="none" stroke="var(--math-accent)" opacity=".5"/>
  {{ $phase := mul (div math.Pi 4) 7 }}
  {{ $plotX := add 42 (mul (div $phase (mul 4 math.Pi)) 209) }}
  {{ $pointX := add 150 (mul 70 (math.Cos $phase)) }}
  {{ $pointY := sub 113 (mul 70 (math.Sin $phase)) }}
  {{ $realY := sub 296 (mul 39 (math.Cos $phase)) }}
  {{ $imaginaryY := sub 449 (mul 39 (math.Sin $phase)) }}
  <g fill="none" stroke-width=".8" stroke-dasharray="3 4" opacity=".4">
    <path d="M{{ $pointX }} {{ $pointY }}L{{ $plotX }} {{ $realY }}" stroke="var(--math-real)"/>
    <path d="M{{ $pointX }} {{ $pointY }}L{{ $plotX }} {{ $imaginaryY }}" stroke="var(--math-imaginary)"/>
  </g>
  {{ $realPath := "" }}
  {{ $imaginaryPath := "" }}
  {{ range seq 0 160 }}
    {{ $fraction := div (float .) 160 }}
    {{ $angle := mul $fraction $phase }}
    {{ $x := add 42 (mul (div $angle (mul 4 math.Pi)) 209) }}
    {{ $command := cond (eq . 0) "M" "L" }}
    {{ $realPath = printf "%s%s%.3f %.3f" $realPath $command $x (sub 296 (mul 39 (math.Cos $angle))) }}
    {{ $imaginaryPath = printf "%s%s%.3f %.3f" $imaginaryPath $command $x (sub 449 (mul 39 (math.Sin $angle))) }}
  {{ end }}
  <g fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="{{ $realPath }}" stroke="var(--math-real)"/>
    <path d="{{ $imaginaryPath }}" stroke="var(--math-imaginary)"/>
    <path d="M150 113L{{ $pointX }} {{ $pointY }}" stroke="var(--math-accent)" stroke-width="1.5"/>
  </g>
  <g stroke="var(--bg)" stroke-width="1.5">
    <circle cx="{{ $pointX }}" cy="{{ $pointY }}" r="4.5" fill="var(--math-accent)"/>
    <circle cx="{{ $plotX }}" cy="{{ $realY }}" r="3.5" fill="var(--math-real)"/>
    <circle cx="{{ $plotX }}" cy="{{ $imaginaryY }}" r="3.5" fill="var(--math-imaginary)"/>
  </g>
</svg>
