{{/* Static SVG; each wave animates a shared dash offset over actual curved edges. */}}
{{ $layers := slice (dict "x" 24 "ys" (slice 76 115 154)) (dict "x" 91 "ys" (slice 37 76 115 154 193)) (dict "x" 158 "ys" (slice 37 76 115 154 193)) (dict "x" 225 "ys" (slice 76 115 154)) }}
<svg class="nn-diagram" viewBox="0 0 250 230" width="250" height="230" role="img" aria-label="A neural network sends waves along curved connections, activating each layer in turn." xmlns="http://www.w3.org/2000/svg">
  {{ range $i := seq 0 2 }}
    {{ $from := index $layers $i }}{{ $to := index $layers (add $i 1) }}
    <g class="nn-layer-{{ $i }}" style="--nn-phase:{{ mul $i 1.4 }}s" aria-hidden="true">
      <g class="nn-connections">
        {{ range $y := $from.ys }}{{ range $nextY := $to.ys }}
          <path d="M{{ $from.x }} {{ $y }}C{{ add $from.x 29 }} {{ $y }} {{ sub $to.x 29 }} {{ $nextY }} {{ $to.x }} {{ $nextY }}"/>
        {{ end }}{{ end }}
      </g>
      <g class="nn-wave">
        {{ range $y := $from.ys }}{{ range $nextY := $to.ys }}
          <path pathLength="1" d="M{{ $from.x }} {{ $y }}C{{ add $from.x 29 }} {{ $y }} {{ sub $to.x 29 }} {{ $nextY }} {{ $to.x }} {{ $nextY }}"/>
        {{ end }}{{ end }}
      </g>
    </g>
  {{ end }}
  {{ range $i, $layer := $layers }}
    <g class="nn-layer-{{ $i }}" style="--nn-phase:{{ mul $i 1.4 }}s" aria-hidden="true">
      <g class="nn-neurons">
        {{ range $y := $layer.ys }}
          <circle class="nn-shell" cx="{{ $layer.x }}" cy="{{ $y }}" r="7.3"/>
          <circle class="nn-core" cx="{{ $layer.x }}" cy="{{ $y }}" r="3.4"/>
        {{ end }}
      </g>
      <g class="nn-activation">
        {{ range $y := $layer.ys }}
          <circle class="nn-halo" cx="{{ $layer.x }}" cy="{{ $y }}" r="11.5"/>
          <circle class="nn-spark" cx="{{ $layer.x }}" cy="{{ $y }}" r="4.8"/>
        {{ end }}
      </g>
    </g>
  {{ end }}
</svg>
