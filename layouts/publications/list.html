{{ define "main" }}
  <article class="h-entry publications-index">
    {{ partial "post/header" (dict "Listing" false "Page" .) }}
    <div class="e-content">
      {{ .Content }}
      <ul class="publication-list" role="list">
        {{ range partial "publications/ordered-pages.html" . }}
        <li>
          <article class="publication-entry">
            <h2 class="pub-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
            {{ partial "publications/metadata.html" . }}
          </article>
        </li>
        {{ end }}
      </ul>
    </div>
  </article>
{{ end }}
