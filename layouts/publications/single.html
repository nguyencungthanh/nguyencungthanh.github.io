{{ define "main" }}
  <article class="h-entry publication-detail">
    {{ partial "post/header" (dict "Listing" false "Page" .) }}
    {{ partial "publications/metadata.html" . }}
    <div class="e-content publication-content">
      {{ .Content }}
    </div>
    <nav class="pub-back" aria-label="Publications navigation">
      <a href="{{ .Parent.RelPermalink }}">← Back to Publications</a>
    </nav>
  </article>
{{ end }}
